# XcodeGen spec - run `xcodegen generate` here (brew install xcodegen). The .xcodeproj is
# gitignored; this file is the source of truth (design §14).
name: iosApp
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.0"   # GitLive 2.3.0 pairs with this Firebase iOS major
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "11.1.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["project.yml", "README.md", "Info.plist", "*.entitlements", "*.xcodeproj", "build", ".build"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trip Planner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Required by Compose Multiplatform's plist sanity check (ProMotion frame pacing).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Maps/Places key (design §11): set the MAPS_API_KEY build setting, never commit a value.
        MAPS_API_KEY: $(MAPS_API_KEY)
        # Hosting domain for invite links (design §8.2).
        APP_LINK_HOST: $(APP_LINK_HOST)
        # Push (design §10): APNs token is forwarded to Firebase Messaging by hand in PushBridge.swift.
        FirebaseAppDelegateProxyEnabled: false
        UIBackgroundModes: [remote-notification]
        # Custom scheme used by the hosting landing page until Universal Links are configured
        # (the post-build script appends the Google Sign-In scheme as a second entry).
        CFBundleURLTypes:
          - CFBundleURLName: app.tripplanner.invite
            CFBundleURLSchemes: [tripplanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tripplanner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MAPS_API_KEY: ""
        APP_LINK_HOST: tripplanner-dev-fe0a4.web.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iosApp.entitlements
        # Simulator builds are ad-hoc signed so the app can use the keychain (Firebase Auth
        # persists the user there; an unsigned build fails with FIRAuthErrorDomain 17995).
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # Kotlin framework produced by the pre-build script below
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMaps
        product: GoogleMaps
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17+)}"
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Google Sign-In's callback needs the reversed client ID as a URL scheme, and the Maps SDK
      # needs a key. Both come from the gitignored GoogleService-Info.plist (the Firebase iOS key
      # doubles as the Maps key until a restricted one exists, design §11), injected into the built
      # Info.plist here - this runs before code signing - instead of being committed.
      - name: Inject Google config into Info.plist
        basedOnDependencyAnalysis: false
        script: |
          set -e
          GSI="$SRCROOT/GoogleService-Info.plist"
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$GSI" ] || { echo "warning: GoogleService-Info.plist missing - sign-in callback not configured"; exit 0; }
          SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GSI")
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes:1" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string google-signin" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
          if [ -z "$MAPS_API_KEY" ]; then
            KEY=$(/usr/libexec/PlistBuddy -c "Print :API_KEY" "$GSI")
            /usr/libexec/PlistBuddy -c "Set :MAPS_API_KEY $KEY" "$PLIST"
          fi
schemes:
  iosApp:
    build:
      targets: { iosApp: all }
    run:
      config: Debug
