# XcodeGen spec - run `xcodegen generate` here (brew install xcodegen). The .xcodeproj is
# gitignored; this file is the source of truth (design §14).
name: iosApp
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.0"   # GitLive 2.3.0 pairs with this Firebase iOS major
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["project.yml", "README.md", "Info.plist", "*.xcodeproj", "build", ".build"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trip Planner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Required by Compose Multiplatform's plist sanity check (ProMotion frame pacing).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Maps/Places key (design §11): set the MAPS_API_KEY build setting, never commit a value.
        MAPS_API_KEY: $(MAPS_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tripplanner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MAPS_API_KEY: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # Kotlin framework produced by the pre-build script below
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17+)}"
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
schemes:
  iosApp:
    build:
      targets: { iosApp: all }
    run:
      config: Debug
