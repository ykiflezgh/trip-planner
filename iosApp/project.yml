# XcodeGen spec - run `xcodegen generate` here (brew install xcodegen). The .xcodeproj is
# gitignored; this file is the source of truth (design §14).
name: iosApp
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.0"   # GitLive 2.3.0 pairs with this Firebase iOS major
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["project.yml", "README.md", "Info.plist", "*.xcodeproj", "build", ".build"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trip Planner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Required by Compose Multiplatform's plist sanity check (ProMotion frame pacing).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Maps/Places key (design §11): set the MAPS_API_KEY build setting, never commit a value.
        MAPS_API_KEY: $(MAPS_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tripplanner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MAPS_API_KEY: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # Kotlin framework produced by the pre-build script below
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17+)}"
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Google Sign-In's callback needs the reversed client ID as a URL scheme. It lives in the
      # gitignored GoogleService-Info.plist, so inject it into the built Info.plist here (runs
      # before code signing) instead of committing it.
      - name: Inject Google Sign-In URL scheme
        basedOnDependencyAnalysis: false
        script: |
          set -e
          GSI="$SRCROOT/GoogleService-Info.plist"
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          [ -f "$GSI" ] || { echo "warning: GoogleService-Info.plist missing - sign-in callback not configured"; exit 0; }
          SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$GSI")
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
schemes:
  iosApp:
    build:
      targets: { iosApp: all }
    run:
      config: Debug
