<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Planner</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;max-width:480px;margin-inline:auto;color:#1c1b1f}
  h1{font-size:1.5rem}code{font-size:1.25rem;background:#f3edf7;padding:6px 10px;border-radius:8px;display:inline-block;margin:8px 0}
  a.btn{display:block;text-align:center;padding:14px;border-radius:24px;background:#6750a4;color:#fff;text-decoration:none;font-weight:600;margin:12px 0}
  .muted{color:#49454f;font-size:.95rem}
</style></head>
<body>
  <h1>Trip Planner</h1>
  <div id="invite" hidden>
    <p>You've been invited to a trip.</p>
    <p class="muted">Invite code</p><code id="code"></code>
    <a id="open" class="btn" href="#">Open in the app</a>
    <p class="muted">Don't have the app yet? Install it, then open this link again or enter the code above under <b>Join a trip</b>.</p>
    <!-- TODO: store badges once the app is listed on Google Play / the App Store. -->
  </div>
  <p id="plain">Open this invite link on your phone with the app installed.</p>
  <script>
    // Design §8.2: App Links / Universal Links open the app directly; this page is the fallback.
    const m = location.pathname.match(/^\/join\/([A-Za-z0-9_-]+)/);
    if (m) {
      const code = m[1];
      document.getElementById('code').textContent = code;
      document.getElementById('invite').hidden = false;
      document.getElementById('plain').hidden = true;
      const ua = navigator.userAgent;
      const open = document.getElementById('open');
      if (/Android/i.test(ua)) {
        // Opens the app even when App Link verification failed; falls back here if not installed.
        open.href = 'intent://' + location.host + '/join/' + code + '#Intent;scheme=https;package=app.tripplanner;end';
      } else {
        open.href = 'tripplanner://join/' + code;  // custom scheme until Universal Links are configured
      }
    }
  </script>
</body></html>
